<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>美図決算 β</title>
<style>
  :root {
    --bg: #F4F6F8; --paper: #FFFFFF; --ink: #1D2433; --sub: #5D6678; --faint: #8A92A0;
    --line: #DDE1E7; --navy: #2B3A67; --navy-soft: #E6EAF3; --green: #3C8A62; --red: #C0563F;
    --sans: 'Noto Sans CJK JP', 'Noto Sans JP', 'Hiragino Sans', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
  body { padding: max(14px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 900px; margin: 0 auto; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 8px 2px 14px; }
  h1 { font-size: 28px; line-height: 1.3; margin: 0; font-weight: 900; letter-spacing: .04em; color: var(--navy); }
  h1 rt { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--sub); }
  .beta { display: inline-block; margin-left: 8px; font-size: 13px; font-weight: 700; color: #fff; background: var(--navy); padding: 2px 8px; border-radius: 4px; vertical-align: middle; }
  .tag { margin: 2px 0 0; color: var(--sub); font-size: 13px; }

  .search { position: relative; }
  .search input { width: 100%; font: inherit; font-size: 18px; padding: 14px 16px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); outline: none; }
  .search input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px var(--navy-soft); }
  .suggest { list-style: none; margin: 6px 0 0; padding: 4px; background: var(--paper); border: 1px solid var(--line);
    border-radius: 10px; position: absolute; left: 0; right: 0; z-index: 5; max-height: 60vh; overflow: auto; }
  .suggest[hidden] { display: none; }
  .suggest button { all: unset; display: flex; gap: 12px; align-items: baseline; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; box-sizing: border-box; }
  .suggest button:focus-visible, .suggest button:hover { background: var(--navy-soft); }
  .suggest .code { font-variant-numeric: tabular-nums; color: var(--navy); font-weight: 700; min-width: 3.2em; }
  .suggest .nodata { margin-left: auto; font-size: 12px; color: var(--faint); }
  .recent { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
  .recent button { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }

  .status { margin: 18px 2px 0; color: var(--sub); font-size: 15px; line-height: 1.7; min-height: 1.7em; }
  .status.error { color: var(--red); }

  .period { margin: 16px 2px 10px; }
  .period h2 { margin: 0; font-size: 19px; line-height: 1.4; }
  .period p { margin: 4px 0 0; font-size: 13px; color: var(--sub); line-height: 1.6; }
  .src { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 4px; margin-right: 6px; border: 1px solid currentColor; }
  .src.tanshin { color: var(--navy); }
  .src.yuho { color: var(--green); }

  figure { margin: 0 0 18px; }
  .chart { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart.zoom svg { width: 1400px; max-width: none; }
  figcaption { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  figcaption .name { font-size: 14px; font-weight: 700; margin-right: auto; }
  .btn { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; cursor: pointer; border: 1.5px solid var(--navy); background: var(--paper); color: var(--navy); }
  .btn.primary { background: var(--navy); color: #fff; }
  .btn:focus-visible { outline: 3px solid var(--navy-soft); outline-offset: 2px; }
  .na { background: var(--paper); border: 1px dashed var(--line); border-radius: 10px; padding: 18px; font-size: 14px; color: var(--sub); line-height: 1.7; }

  .more { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
  .more h3 { font-size: 14px; margin: 14px 2px 8px; color: var(--sub); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: 14px; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--navy); background: var(--paper); color: var(--navy); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--navy); color: #fff; }
  .chips .none { font-size: 13px; color: var(--faint); padding: 6px 2px; }
  .extra { margin-top: 18px; }
  .extra section { border-top: 2px solid var(--navy); margin-top: 18px; }
  .hint { margin: 8px 2px 0; font-size: 12.5px; color: var(--faint); }
  footer { margin: 30px 2px 0; font-size: 12px; color: var(--faint); line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><ruby>美図<rt>ビジュ</rt></ruby>決算<span class="beta">β</span></h1>
      <p class="tag">儲けは、川の流れのように</p>
    </div>
  </header>

  <div class="search" role="search">
    <input id="q" type="search" autocomplete="off" placeholder="銘柄名か証券コード" aria-label="銘柄名か証券コード" aria-controls="suggest">
    <ul id="suggest" class="suggest" role="listbox" hidden></ul>
  </div>
  <ul id="recent" class="recent" aria-label="最近見た銘柄"></ul>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <div id="main"></div>
  <div id="more" class="more" hidden>
    <h3>当期の四半期</h3>
    <div class="chips" id="chipsQ"></div>
    <h3>過去の年次決算</h3>
    <div class="chips" id="chipsY"></div>
    <div class="extra" id="extra"></div>
  </div>

  <footer>
    βテスト版です。数字は東証の適時開示（TDnet）の決算短信と、金融庁EDINETの有価証券報告書（取り込みは準備中）をもとに HIKICHI ＆ Company が作成しています。同じ期は有報を優先します。データは毎日夜に更新します。図は事実の整理で、売買をすすめるものではありません。気づいた点はJODANまでお寄せください。<br>©HIKICHI＆Company
  </footer>
</div>

<script src="kessan.js"></script>
<script src="app.js"></script>
</body>
</html>
