name: 毎日の取り込み（TDnetの決算短信）

on:
  schedule:
    # 日本時間で 15:33、16:03〜18:03 は30分ごと、19:03〜23:03 は1時間ごと（1日11回）
    # ちょうどの時刻は混んで遅れやすいので、3分ずらしている（GitHubの時刻は世界標準時＝日本時間−9時間）
    - cron: '33 6-8 * * *'
    - cron: '3 7-14 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: '取り込む最初の日（例 20261030、空なら昨日）'
        required: false
      to:
        description: '取り込む最後の日（例 20261030、空なら今日）'
        required: false
      redo:
        description: '取り込み済みの決算も読み直して上書きする（今ある数字は消さずに置き換え）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 部品を入れる
        working-directory: pipeline
        run: npm install --no-audit --no-fund
      - name: 銘柄の区分を更新する（週1回：東証の上場銘柄一覧と日経225）
        working-directory: pipeline
        run: node market.js || echo "区分の更新は次回に持ち越し"
      - name: 今日と昨日の決算短信を取り込む（取り込み済みはとばす）
        working-directory: pipeline
        run: node fetch.js ${{ inputs.from }} ${{ inputs.to }} ${{ inputs.redo && '--redo' || '' }}
      - name: 変わった数字を保存する
        run: |
          git config user.name  "BizKessan bot"
          git config user.email "bizkessan-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "新しい決算はありませんでした"
          else
            git commit -m "決算データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git pull --rebase -X theirs origin main
            git push
          fi

  # 取り込んだ数字を公開先（Cloudflare）にも反映する
  publish:
    needs: fetch
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
