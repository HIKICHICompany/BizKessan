name: 毎日の取り込み（TDnetの決算短信）

on:
  schedule:
    # 日本時間 22:17 に毎日1回（多くの決算短信は15時〜20時に出るため）
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: '取り込む最初の日（例 20261030、空なら昨日）'
        required: false
      to:
        description: '取り込む最後の日（例 20261030、空なら今日）'
        required: false

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 部品を入れる
        working-directory: pipeline
        run: npm install --no-audit --no-fund
      - name: 今日と昨日の決算短信を取り込む
        working-directory: pipeline
        run: node fetch.js ${{ inputs.from }} ${{ inputs.to }}
      - name: 変わった数字を保存する
        run: |
          git config user.name  "BizKessan bot"
          git config user.email "bizkessan-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "新しい決算はありませんでした"
          else
            git commit -m "決算データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
