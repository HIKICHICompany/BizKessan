name: 公開（Cloudflare：画面と合言葉の関所）

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'worker/**', '.github/workflows/deploy.yml']

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PASS_SECRET: ${{ secrets.PASS_SECRET }}
    steps:
      - name: 準備ができているか確かめる
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PASS_SECRET" ]; then
            echo "Cloudflareの設定がまだないため、公開はとばします"; echo "go=no" >> $GITHUB_OUTPUT
          else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'yes'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'yes'
        with:
          node-version: '22'
      - name: 公開する
        if: steps.ready.outputs.go == 'yes'
        working-directory: worker
        run: |
          # 貼り付けたときに付いた空白や改行を取り除く
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npm install --no-audit --no-fund
          ./build.sh
          npx wrangler deploy
          printf '%s' "$PASS_SECRET" | npx wrangler secret put PASS_SECRET
      - name: 公開できたか確かめる（お試しは見える・メンバー特典は鍵がかかる）
        if: steps.ready.outputs.go == 'yes'
        run: |
          sleep 10
          B=https://bizkessan.hikichicompany.workers.dev
          c(){ curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$@"; }
          FREE=$(node -e "const m=require('./data/meta/market.json');const fs=require('fs');console.log(m.n225.find(c=>fs.existsSync('data/companies/'+c+'.json')))")
          MEM=$(node -e "const m=require('./data/meta/market.json');const fs=require('fs');console.log(fs.readdirSync('data/companies').map(f=>f.slice(0,4)).find(c=>!m.n225.includes(c)&&/^[0-9A-Z]{4}$/.test(c)))")
          CODE=$(node pipeline/passcode.js)
          TOK=$(curl -s -X POST -H 'Content-Type: application/json' -d "{\"code\":\"$CODE\"}" $B/api/login | node -pe 'JSON.parse(require("fs").readFileSync(0)).token||""')
          r1=$(c $B/); r2=$(c $B/data/index.json); r3=$(c $B/data/companies/$FREE.json); r4=$(c $B/data/companies/$MEM.json); r5=$(c -H "X-Biz-Token: $TOK" $B/data/companies/$MEM.json); r6=$(c $B/data/processed.json)
          echo "画面 $r1 / 目次 $r2 / お試し($FREE) $r3 / メンバー($MEM)合言葉なし $r4 / 合言葉あり $r5 / 取り込み記録 $r6"
          [ "$r1$r2$r3$r4$r5$r6" = "200200200401200404" ] || { echo "思ったとおりに動いていません"; exit 1; }
          echo "すべて思ったとおりです"
