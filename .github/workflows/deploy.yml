name: 公開（Cloudflare：画面と合言葉の関所）

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'worker/**', '.github/workflows/deploy.yml']

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PASS_SECRET: ${{ secrets.PASS_SECRET }}
    steps:
      - name: 準備ができているか確かめる
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PASS_SECRET" ]; then
            echo "Cloudflareの設定がまだないため、公開はとばします"; echo "go=no" >> $GITHUB_OUTPUT
          else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'yes'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'yes'
        with:
          node-version: '20'
      - name: 公開する
        if: steps.ready.outputs.go == 'yes'
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          ./build.sh
          npx wrangler deploy
          printf '%s' "$PASS_SECRET" | npx wrangler secret put PASS_SECRET
